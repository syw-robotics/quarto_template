<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quarto RevealJS Theme Gallery</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f4ee;
      --fg: #24211d;
      --muted: #706a62;
      --line: #ded6ca;
      --accent: #c96442;
      --card: #fffdf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1040px, calc(100% - 32px));
      margin: 56px auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      max-width: 680px;
      margin: 0 0 28px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    a {
      display: block;
      min-height: 116px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      border-color: var(--accent);
    }

    strong {
      display: block;
      margin-bottom: 8px;
      font-size: 1.15rem;
    }

    span {
      color: var(--muted);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Quarto RevealJS Themes</h1>
    <p>Check the same presentation rendered with each theme.</p>
    <br>
    <div class="grid">
      <a href="./default/"><strong>Default</strong><span>Academic default with red accents.</span></a>
      <a href="./claude/"><strong>Claude</strong><span>Claude palette and serif typography.</span></a>
      <a href="./sustech/"><strong>SUSTech</strong><span>Green and orange SUSTech university style.</span></a>
      <a href="./minimal/"><strong>Minimal</strong><span>Neutral compact technical style.</span></a>
    </div>
  </main>
</body>
</html>
